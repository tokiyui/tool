```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共通イベント検索</title>
</head>
<body>

<h2>共通イベント検索</h2>

<input type="text" id="actor1" placeholder="アーティスト名1を入力">
<input type="text" id="actor2" placeholder="アーティスト名2を入力">

<select id="mode">
    <option value="and">共演した</option>
    <option value="all">全ての</option>
    <option value="only">単独の</option>
</select>

<button id="searchBtn">検索</button>

<div id="status"></div>
<div id="result"></div>

<script>
const proxyUrl = 'https://worker.ryohorita105.workers.dev/?url=';

// アーティストID取得
async function fetchActorId(actorName) {
    const searchUrl = proxyUrl + encodeURIComponent(
        `https://www.eventernote.com/actors/search?keyword=${encodeURIComponent(actorName)}`
    );

    const response = await fetch(searchUrl);
    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');

    const actorLinks = doc.querySelectorAll('li a');

    for (const link of actorLinks) {
        if (link.textContent.trim().includes(actorName)) {
            const actorUrl = link.getAttribute('href');
            if (!actorUrl) continue;

            const match = actorUrl.match(/\/actors\/(?:[^/]+\/)?(\d+)\/?$/);
            if (match) return match[1];

            return actorUrl.split('/').filter(Boolean).pop();
        }
    }

    return null;
}

// イベント一覧取得
async function fetchEventData(url) {
    const response = await fetch(proxyUrl + encodeURIComponent(url));
    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    const events = doc.querySelectorAll('li.clearfix');
    const data = [];

    events.forEach(event => {
        const dateElem = event.querySelector('p[class^="day"]');

        if (!dateElem) {
            data.push({
                data: [
                    'Date information not available',
                    '',
                    '',
                    '',
                    '',
                    'Title not available',
                    'Venue not available'
                ],
                url: null
            });
            return;
        }

        const dateStr = dateElem.textContent.trim();
        const dateInfo = dateStr.split(' ');
        const year = dateInfo[0].slice(0, 4);
        const month = dateInfo[0].slice(5, 7);
        const day = dateInfo[0].slice(8, 10);
        const weekday = dateInfo[1] ? dateInfo[1].charAt(1) : '';

        const startTimeElem = event.querySelector('span.s');
        const startTime = startTimeElem
            ? startTimeElem.textContent.trim().split(' ')[3]
            : '--:--';

        const titleElem = event.querySelector('h4');
        const title = titleElem
            ? titleElem.textContent.trim()
            : 'Title not available';

        const venueElem = event.querySelector('div.place');
        const venue = venueElem
            ? venueElem.textContent.trim().replace('会場:', '').trim()
            : 'Venue not available';

        let eventUrl = null;

        for (const link of event.querySelectorAll('a')) {
            const href = link.getAttribute('href');

            if (href && /\/events\/\d+/.test(href)) {
                eventUrl = href.startsWith('/')
                    ? 'https://www.eventernote.com' + href
                    : href;
                break;
            }
        }

        data.push({
            data: [year, month, day, weekday, startTime, title, venue],
            url: eventUrl
        });
    });

    return data;
}

// 「出演者」欄だけから出演者IDを取得
async function fetchEventActors(eventUrl) {
    if (!eventUrl) return null;

    const response = await fetch(
        proxyUrl + encodeURIComponent(eventUrl)
    );

    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');

    let performerContainer = null;

    // まず dt → dd の構造を探す
    for (const dt of doc.querySelectorAll('dt')) {
        if (dt.textContent.trim() === '出演者') {
            performerContainer = dt.nextElementSibling;
            break;
        }
    }

    // 次に th → td の構造を探す
    if (!performerContainer) {
        for (const th of doc.querySelectorAll('th')) {
            if (th.textContent.trim() === '出演者') {
                performerContainer = th.nextElementSibling;
                break;
            }
        }
    }

    // 最後に「出演者」という文字を持つ要素から次の兄弟を探す
    if (!performerContainer) {
        for (const element of doc.querySelectorAll('body *')) {
            if (
                element.children.length === 0 &&
                element.textContent.trim() === '出演者'
            ) {
                performerContainer = element.nextElementSibling;
                if (performerContainer) break;
            }
        }
    }

    if (!performerContainer) {
        console.warn('出演者欄が見つかりません:', eventUrl);
        return null;
    }

    const actorIds = [];

    performerContainer
        .querySelectorAll('a[href*="/actors/"]')
        .forEach(link => {
            const href = link.getAttribute('href');
            if (!href) return;

            const match = href.match(/\/actors\/(?:[^/]+\/)?(\d+)\/?$/);

            if (match) {
                actorIds.push(match[1]);
            }
        });

    return [...new Set(actorIds)];
}

// Aだけが出演しているか判定
async function isAOnly(event, actorId1) {
    const actorIds = await fetchEventActors(event.url);

    if (actorIds === null) {
        return false;
    }

    return actorIds.length === 1 &&
           actorIds[0] === String(actorId1);
}

// 結果表示
function displayEvents(events, resultDiv) {
    if (events.length === 0) {
        resultDiv.textContent = '該当するイベントはありません';
        return;
    }

    events.forEach(event => {
        const p = document.createElement('p');
        p.textContent = event.data.join(', ');
        resultDiv.appendChild(p);
    });
}

// メイン処理
async function findCommonEvents() {
    const actor1 = document.getElementById('actor1').value.trim();
    const actor2 = document.getElementById('actor2').value.trim();
    const mode = document.getElementById('mode').value;
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');

    if (!actor1) {
        alert('アーティスト名1を入力してください');
        return;
    }

    if (mode === 'and' && !actor2) {
        alert('「共演した」ではアーティスト名2も入力してください');
        return;
    }

    statusDiv.textContent = 'アーティストを検索中です...';
    resultDiv.innerHTML = '';

    const actorId1 = await fetchActorId(actor1);

    if (!actorId1) {
        alert('アーティスト名1が見つかりませんでした');
        statusDiv.textContent = '';
        return;
    }

    statusDiv.textContent = '出演イベントを取得中です...';

    const url1 =
        `https://www.eventernote.com/actors/${actorId1}/events?limit=2000`;

    const data1 = await fetchEventData(url1);

    // 全てのイベント
    if (mode === 'all') {
        statusDiv.textContent = '';
        displayEvents(data1, resultDiv);
        return;
    }

    // 共演したイベント
    if (mode === 'and') {
        statusDiv.textContent = '出演イベントを取得中です...';

        const actorId2 = await fetchActorId(actor2);

        if (!actorId2) {
            alert('アーティスト名2が見つかりませんでした');
            statusDiv.textContent = '';
            return;
        }

        const url2 =
            `https://www.eventernote.com/actors/${actorId2}/events?limit=2000`;

        const data2 = await fetchEventData(url2);

        statusDiv.textContent = '共演イベントを検索中です...';

        const commonEvents = data1.filter(event1 =>
            data2.some(event2 =>
                JSON.stringify(event1.data) ===
                JSON.stringify(event2.data)
            )
        );

        statusDiv.textContent = '';
        displayEvents(commonEvents, resultDiv);
        return;
    }

    // 単独のイベント
    if (mode === 'only') {
        const onlyEvents = [];

        for (let i = 0; i < data1.length; i++) {
            statusDiv.textContent =
                `判定中です... ${i + 1} / ${data1.length}`;

            if (await isAOnly(data1[i], actorId1)) {
                onlyEvents.push(data1[i]);
            }
        }

        statusDiv.textContent = '';
        displayEvents(onlyEvents, resultDiv);
    }
}

document
    .getElementById('searchBtn')
    .addEventListener('click', findCommonEvents);
</script>

</body>
</html>
