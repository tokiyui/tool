<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>気圧面・時間断面図</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  body {
    font-family: sans-serif;
    margin: 16px;
    color: #222;
  }
  h2 {
    margin-bottom: 12px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 12px;
    margin-bottom: 12px;
  }
  .controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 14px;
  }
  input {
    width: 120px;
    padding: 6px;
    box-sizing: border-box;
  }
  button {
    padding: 7px 16px;
    cursor: pointer;
  }
  #error {
    color: #b00020;
    white-space: pre-wrap;
    margin: 8px 0;
  }
  #chart {
    width: 100%;
    height: 760px;
    position: relative;
  }
  #windOverlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .note {
    color: #555;
    font-size: 12px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h2>気圧面・時間断面図</h2>

<div class="controls">
  <label>
    緯度
    <input id="latitude" type="number" min="-90" max="90"
           step="0.1" value="35">
  </label>
  <label>
    経度
    <input id="longitude" type="number" min="-180" max="180"
           step="0.1" value="135">
  </label>
  <button id="drawButton" type="button">描画</button>
</div>

<div id="error" role="alert"></div>

<div id="chart">
  <svg id="windOverlay" aria-hidden="true"></svg>
</div>

<div class="note">
  ECMWF IFS 0.25°モデル／予報期間3日／1時間間隔／日本標準時。
  気温等値線は3℃間隔。風の矢羽根は風速をノットに換算して表示します。
</div>

<script>
"use strict";

/* 固定設定 */
const MODEL = "ecmwf_ifs025";
const FORECAST_DAYS = 3;
const TIMEZONE = "Asia/Tokyo";
const PRESSURE_LEVELS = [300, 400, 500, 600, 700, 850, 925];
const TEMPERATURE_INTERVAL = 3;

/*
 * 欠損値補間
 * 前後に有効値がある欠損だけを線形補間する。
 * 先頭・末尾など、前後両方の値がない欠損はそのまま残す。
 */
function interpolateMissing(values) {
  const result = values.map(v =>
    Number.isFinite(v) ? v : NaN
  );

  let i = 0;

  while (i < result.length) {
    if (Number.isFinite(result[i])) {
      i++;
      continue;
    }

    const start = i;

    while (i < result.length && !Number.isFinite(result[i])) {
      i++;
    }

    const end = i;
    const left = start - 1;
    const right = end;

    if (
      left >= 0 &&
      right < result.length &&
      Number.isFinite(result[left]) &&
      Number.isFinite(result[right])
    ) {
      const leftValue = result[left];
      const rightValue = result[right];
      const span = right - left;

      for (let j = start; j < end; j++) {
        const fraction = (j - left) / span;
        result[j] =
          leftValue + (rightValue - leftValue) * fraction;
      }
    }
  }

  return result;
}

function numericArray(values) {
  return values.map(v => {
    if (v === null || v === undefined || v === "") return NaN;
    const n = Number(v);
    return Number.isFinite(n) ? n : NaN;
  });
}

/* 気象学的な風向・風速から東西・南北成分を作成する。 */
function windComponents(speedMs, directionDeg) {
  const u = [];
  const v = [];

  for (let i = 0; i < speedMs.length; i++) {
    const speed = speedMs[i];
    const direction = directionDeg[i];

    if (!Number.isFinite(speed) || !Number.isFinite(direction)) {
      u.push(NaN);
      v.push(NaN);
      continue;
    }

    const rad = direction * Math.PI / 180;

    // 風向は「風が吹いてくる方向」
    u.push(-speed * Math.sin(rad));
    v.push(-speed * Math.cos(rad));
  }

  return {
    u: interpolateMissing(u),
    v: interpolateMissing(v)
  };
}

/* 時刻文字列を日本標準時として数値化する。 */
function timeToEpoch(value) {
  // Open-Meteoの時刻は通常 YYYY-MM-DDTHH:MM 形式
  return new Date(value + ":00+09:00").getTime();
}

/* 風ベクトルから風速・風向を求める。 */
function vectorToWind(u, v) {
  const speedMs = Math.hypot(u, v);
  const direction =
    (Math.atan2(-u, -v) * 180 / Math.PI + 360) % 360;

  return { speedMs, direction };
}

/*
 * 風の矢羽根をSVGで描画する。
 * 50ノット単位：旗
 * 10ノット単位：長い羽根
 * 5ノット単位：短い羽根
 */
function makeWindBarb(svg, x, y, speedMs, directionDeg) {
  if (
    !Number.isFinite(x) ||
    !Number.isFinite(y) ||
    !Number.isFinite(speedMs) ||
    !Number.isFinite(directionDeg)
  ) {
    return;
  }

  const knots = speedMs * 1.943844;
  if (knots < 2.5) return;

  const ns = "http://www.w3.org/2000/svg";
  const group = document.createElementNS(ns, "g");

  group.setAttribute("stroke", "#111");
  group.setAttribute("fill", "#111");
  group.setAttribute("stroke-width", "1.2");
  group.setAttribute("stroke-linecap", "round");
  group.setAttribute("stroke-linejoin", "round");

  /*
   * 気象図の風向に合わせ、軸を風が吹いてくる方向へ伸ばす。
   * SVG座標では下向きが正なので、y方向の符号を反転する。
   */
  const rad = directionDeg * Math.PI / 180;
  const dx = Math.sin(rad);
  const dy = -Math.cos(rad);

  const shaftLength = 31;
  const x2 = x + dx * shaftLength;
  const y2 = y + dy * shaftLength;

  function line(x1, y1, xx2, yy2) {
    const el = document.createElementNS(ns, "line");
    el.setAttribute("x1", x1);
    el.setAttribute("y1", y1);
    el.setAttribute("x2", xx2);
    el.setAttribute("y2", yy2);
    group.appendChild(el);
  }

  // 主軸
  line(x, y, x2, y2);

  // 羽根は軸の後端側から配置
  let remaining = Math.round(knots / 5) * 5;
  let position = shaftLength;
  const alongStep = 5.2;
  const fullLength = 12;
  const halfLength = 6;

  while (remaining >= 50) {
    const bx = x + dx * position;
    const by = y + dy * position;

    const tx = bx - dx * 9;
    const ty = by - dy * 9;

    const flag = document.createElementNS(ns, "polygon");
    flag.setAttribute(
      "points",
      `${bx},${by} ${tx},${ty} ${tx + dy * 10},${ty - dx * 10}`
    );
    group.appendChild(flag);

    remaining -= 50;
    position -= alongStep;
  }

  while (remaining >= 10) {
    const bx = x + dx * position;
    const by = y + dy * position;

    // 軸から横方向に伸ばす
    line(
      bx, by,
      bx + dy * fullLength,
      by + dx * fullLength
    );

    remaining -= 10;
    position -= alongStep;
  }

  if (remaining >= 5) {
    const bx = x + dx * position;
    const by = y + dy * position;

    line(
      bx, by,
      bx + dy * halfLength,
      by + dx * halfLength
    );
  }

  svg.appendChild(group);
}

/* Plotlyの座標系に合わせて矢羽根を重ねる。 */
function drawWindOverlay(gd, times, windByLevel) {
  const svg = document.getElementById("windOverlay");
  svg.replaceChildren();

  const width = gd.clientWidth;
  const height = gd.clientHeight;

  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);

  const full = gd._fullLayout;
  if (!full || !full.xaxis || !full.yaxis) return;

  const xa = full.xaxis;
  const ya = full.yaxis;

  const xOffset = xa._offset;
  const yOffset = ya._offset;

  // 矢羽根が重なりすぎないよう、原則3時間ごとに表示
  const timeStep = 3;

  for (let p = 0; p < PRESSURE_LEVELS.length; p++) {
    const level = PRESSURE_LEVELS[p];
    const series = windByLevel[level];

    if (!series) continue;

    for (let i = 0; i < times.length; i += timeStep) {
      const u = series.u[i];
      const v = series.v[i];

      if (!Number.isFinite(u) || !Number.isFinite(v)) continue;

      const { speedMs, direction } = vectorToWind(u, v);

      const xPx = xOffset + xa.d2p(times[i]);
      const yPx = yOffset + ya.d2p(level);

      makeWindBarb(svg, xPx, yPx, speedMs, direction);
    }
  }
}

/* APIデータ取得・図の作成 */
async function drawChart() {
  const errorEl = document.getElementById("error");
  errorEl.textContent = "";

  const lat = Number(document.getElementById("latitude").value);
  const lon = Number(document.getElementById("longitude").value);

  if (
    !Number.isFinite(lat) || lat < -90 || lat > 90 ||
    !Number.isFinite(lon) || lon < -180 || lon > 180
  ) {
    errorEl.textContent = "緯度または経度が範囲外です。";
    return;
  }

  const variables = [];

  for (const p of PRESSURE_LEVELS) {
    variables.push(`temperature_${p}hPa`);
    variables.push(`dew_point_${p}hPa`);
    variables.push(`wind_speed_${p}hPa`);
    variables.push(`wind_direction_${p}hPa`);
  }

  const params = new URLSearchParams({
    latitude: String(lat),
    longitude: String(lon),
    hourly: variables.join(","),
    models: MODEL,
    forecast_days: String(FORECAST_DAYS),
    timezone: TIMEZONE,
    wind_speed_unit: "ms"
  });

  const url =
    "https://api.open-meteo.com/v1/forecast?" + params.toString();

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`APIエラー: HTTP ${response.status}`);
    }

    const data = await response.json();

    if (!data.hourly || !Array.isArray(data.hourly.time)) {
      throw new Error("予報データの形式が想定と異なります。");
    }

    const times = data.hourly.time.map(timeToEpoch);
    const xDates = times.map(t => new Date(t));

    const temperature = [];
    const dewpoint = [];
    const spread = [];
    const windByLevel = {};

    for (const p of PRESSURE_LEVELS) {
      const t = interpolateMissing(
        numericArray(data.hourly[`temperature_${p}hPa`])
      );

      const td = interpolateMissing(
        numericArray(data.hourly[`dew_point_${p}hPa`])
      );

      temperature.push(t);
      dewpoint.push(td);

      // T−Td。欠損値補間後に計算
      spread.push(
        t.map((value, i) =>
          Number.isFinite(value) && Number.isFinite(td[i])
            ? value - td[i]
            : NaN
        )
      );

      const speed = numericArray(
        data.hourly[`wind_speed_${p}hPa`]
      );

      const direction = numericArray(
        data.hourly[`wind_direction_${p}hPa`]
      );

      // 風向角そのものではなく、風ベクトル成分を補間する
      windByLevel[p] = windComponents(speed, direction);
    }

    /*
     * T−Tdの色分け：
     * 3℃以下       濃い緑
     * 3〜6℃        薄い緑
     * 6〜15℃       透明
     * 15℃以上      黄色
     *
     * 等値線は描かず、塗り分けのみ。
     */
    const spreadTrace = {
      type: "heatmap",
      x: xDates,
      y: PRESSURE_LEVELS,
      z: spread,
      zmin: 0,
      zmax: 30,
      zsmooth: false,
      showscale: false,
      hovertemplate:
        "時刻: %{x|%m/%d %H:%M}<br>" +
        "気圧: %{y} hPa<br>" +
        "T−Td: %{z:.1f}℃<extra></extra>",
      colorscale: [
        [0.0000, "#18752b"],
        [0.0999, "#18752b"],   // 3℃まで濃い緑
        [0.1000, "#b9e6a5"],
        [0.1999, "#b9e6a5"],   // 6℃まで薄い緑
        [0.2000, "rgba(255,255,255,0)"],
        [0.4999, "rgba(255,255,255,0)"],
        [0.5000, "#ffe84a"],   // 15℃から黄色
        [1.0000, "#ffe84a"]
      ]
    };

    /*
     * 気温等値線。
     * T−Tdの等値線は作成しない。
     */
    const temperatureTrace = {
      type: "contour",
      x: xDates,
      y: PRESSURE_LEVELS,
      z: temperature,
      autocontour: false,
      contours: {
        start: -60,
        end: 45,
        size: TEMPERATURE_INTERVAL,
        coloring: "lines",
        showlabels: true,
        labelfont: {
          size: 10,
          color: "#222"
        }
      },
      line: {
        color: "#333",
        width: 1
      },
      showscale: false,
      connectgaps: false,
      hovertemplate:
        "時刻: %{x|%m/%d %H:%M}<br>" +
        "気圧: %{y} hPa<br>" +
        "気温: %{z:.1f}℃<extra></extra>"
    };

    const layout = {
      title: {
        text:
          `気圧面・時間断面図　` +
          `緯度 ${lat.toFixed(2)}°　経度 ${lon.toFixed(2)}°`,
        x: 0.5
      },
      autosize: true,
      margin: { l: 75, r: 25, t: 70, b: 80 },
      paper_bgcolor: "white",
      plot_bgcolor: "white",
      xaxis: {
        title: "日本標準時",
        type: "date",
        tickformat: "%m/%d<br>%H:%M",
        showgrid: true,
        gridcolor: "#ddd",
        zeroline: false
      },
      yaxis: {
        title: "気圧 (hPa)",
        type: "linear",
        range: [950, 275],
        tickmode: "array",
        tickvals: PRESSURE_LEVELS,
        ticktext: PRESSURE_LEVELS.map(p => String(p)),
        showgrid: true,
        gridcolor: "#ccc",
        zeroline: false
      },
      showlegend: false
    };

    const config = {
      responsive: true,
      displaylogo: false,
      scrollZoom: true
    };

    const gd = document.getElementById("chart");

    // オーバーレイSVGをPlotlyの描画領域の上に配置する
    await Plotly.newPlot(
      gd,
      [spreadTrace, temperatureTrace],
      layout,
      config
    );

    drawWindOverlay(gd, times, windByLevel);

    // ズーム・リサイズ後も矢羽根の位置を更新
    if (!gd._windOverlayHandlerAttached) {
      gd.on("plotly_afterplot", () => {
        if (gd._windTimes && gd._windData) {
          drawWindOverlay(gd, gd._windTimes, gd._windData);
        }
      });

      gd._windOverlayHandlerAttached = true;
    }

    gd._windTimes = times;
    gd._windData = windByLevel;

  } catch (error) {
    errorEl.textContent =
      "図を作成できませんでした。\n" +
      (error && error.message ? error.message : String(error));
  }
}

document.getElementById("drawButton").addEventListener("click", drawChart);

window.addEventListener("resize", () => {
  const gd = document.getElementById("chart");

  if (gd._windTimes && gd._windData) {
    drawWindOverlay(gd, gd._windTimes, gd._windData);
  }
});

// 初回描画
drawChart();
</script>

</body>
</html>
