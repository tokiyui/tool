<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>気圧面・時間断面図</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  body {
    font-family: sans-serif;
    margin: 16px;
    color: #222;
  }
  h2 { margin: 0 0 12px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 12px;
    margin-bottom: 12px;
  }
  .controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 14px;
  }
  input {
    width: 120px;
    padding: 6px;
    box-sizing: border-box;
  }
  button { padding: 7px 16px; cursor: pointer; }
  #error {
    color: #b00020;
    white-space: pre-wrap;
    margin: 8px 0;
  }
  #chart {
    width: 100%;
    height: 760px;
    position: relative;
  }
  #windOverlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .note {
    color: #555;
    font-size: 12px;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h2>気圧面・時間断面図</h2>

<div class="controls">
  <label>緯度
    <input id="latitude" type="number"
           min="-90" max="90" step="0.1" value="35">
  </label>
  <label>経度
    <input id="longitude" type="number"
           min="-180" max="180" step="0.1" value="135">
  </label>
  <button id="drawButton" type="button">描画</button>
</div>

<div id="error" role="alert"></div>

<div id="chart">
  <svg id="windOverlay" aria-hidden="true"></svg>
</div>

<div class="note">
  ECMWF IFS 0.25°モデル／予報期間3日／1時間間隔／日本標準時。
  気温等値線は3℃間隔。風の矢羽根はノット単位で表示します。
</div>

<script>
"use strict";

/* 固定設定 */
const MODEL = "ecmwf_ifs025";
const FORECAST_DAYS = 3;
const TIMEZONE = "Asia/Tokyo";
const PRESSURE_LEVELS = [300, 400, 500, 600, 700, 850, 925];
const TEMPERATURE_INTERVAL = 3;

/* 滑らかな描画用の気圧格子。元データはこの間隔では取得しない。 */
const DENSE_PRESSURES = [];
for (let p = 300; p <= 925; p += 5) {
  DENSE_PRESSURES.push(p);
}

/*
 * 欠損値を前後の有効値から線形補間する。
 * 両側の有効値が存在しない端の欠損は埋めない。
 */
function interpolateMissing(values) {
  const result = values.map(v =>
    Number.isFinite(v) ? v : NaN
  );

  let i = 0;

  while (i < result.length) {
    if (Number.isFinite(result[i])) {
      i++;
      continue;
    }

    const start = i;

    while (i < result.length &&
           !Number.isFinite(result[i])) {
      i++;
    }

    const end = i;
    const left = start - 1;
    const right = end;

    if (
      left >= 0 &&
      right < result.length &&
      Number.isFinite(result[left]) &&
      Number.isFinite(result[right])
    ) {
      const a = result[left];
      const b = result[right];
      const span = right - left;

      for (let j = start; j < end; j++) {
        result[j] = a + (b - a) * ((j - left) / span);
      }
    }
  }

  return result;
}

function numericArray(values) {
  if (!Array.isArray(values)) return [];

  return values.map(v => {
    if (v === null || v === undefined || v === "") {
      return NaN;
    }

    const n = Number(v);
    return Number.isFinite(n) ? n : NaN;
  });
}

/*
 * 時刻を日本標準時として数値化する。
 * APIの時刻は YYYY-MM-DDTHH:MM 形式。
 */
function timeToEpoch(value) {
  return new Date(value + ":00+09:00").getTime();
}

/*
 * 気圧方向にも線形補間する。
 * 元の7気圧面を、描画用の5 hPa間隔の格子へ補間する。
 * これは表示上の補間であり、実際の予報データが
 * 5 hPa間隔で提供されているという意味ではない。
 */
function interpolatePressureGrid(matrix, sourceLevels, targetLevels) {
  return targetLevels.map(targetP => {
    let lower = -1;
    let upper = -1;

    for (let i = 0; i < sourceLevels.length - 1; i++) {
      if (
        targetP >= sourceLevels[i] &&
        targetP <= sourceLevels[i + 1]
      ) {
        lower = i;
        upper = i + 1;
        break;
      }
    }

    if (lower === -1 || upper === -1) {
      return matrix[0].map(() => NaN);
    }

    const p1 = sourceLevels[lower];
    const p2 = sourceLevels[upper];
    const ratio = (targetP - p1) / (p2 - p1);

    return matrix[lower].map((v1, timeIndex) => {
      const v2 = matrix[upper][timeIndex];

      if (!Number.isFinite(v1) || !Number.isFinite(v2)) {
        return NaN;
      }

      return v1 + (v2 - v1) * ratio;
    });
  });
}

/*
 * 風速・風向を東西(u)・南北(v)成分に変換。
 * 風向角を直接補間せず、成分ごとに欠損を補間する。
 */
function windComponents(speedMs, directionDeg) {
  const u = [];
  const v = [];

  const n = Math.max(speedMs.length, directionDeg.length);

  for (let i = 0; i < n; i++) {
    const speed = speedMs[i];
    const direction = directionDeg[i];

    if (
      !Number.isFinite(speed) ||
      !Number.isFinite(direction)
    ) {
      u.push(NaN);
      v.push(NaN);
      continue;
    }

    const rad = direction * Math.PI / 180;

    // 風向は「吹いてくる方向」
    u.push(-speed * Math.sin(rad));
    v.push(-speed * Math.cos(rad));
  }

  return {
    u: interpolateMissing(u),
    v: interpolateMissing(v)
  };
}

function vectorToWind(u, v) {
  return {
    speedMs: Math.hypot(u, v),
    direction:
      (Math.atan2(-u, -v) * 180 / Math.PI + 360) % 360
  };
}

/*
 * 気象図形式の風の矢羽根。
 * 50 kt：旗、10 kt：長い羽根、5 kt：短い羽根。
 */
function makeWindBarb(svg, x, y, speedMs, directionDeg) {
  if (![x, y, speedMs, directionDeg].every(Number.isFinite)) {
    return;
  }

  const knots = Math.round(speedMs * 1.943844 / 5) * 5;
  if (knots < 5) return;

  const ns = "http://www.w3.org/2000/svg";
  const group = document.createElementNS(ns, "g");

  group.setAttribute("stroke", "#111");
  group.setAttribute("fill", "#111");
  group.setAttribute("stroke-width", "1.15");
  group.setAttribute("stroke-linecap", "round");
  group.setAttribute("stroke-linejoin", "round");

  const rad = directionDeg * Math.PI / 180;
  const dx = Math.sin(rad);
  const dy = -Math.cos(rad);
  const shaftLength = 30;

  const x2 = x + dx * shaftLength;
  const y2 = y + dy * shaftLength;

  function line(x1, y1, xx2, yy2) {
    const el = document.createElementNS(ns, "line");
    el.setAttribute("x1", x1);
    el.setAttribute("y1", y1);
    el.setAttribute("x2", xx2);
    el.setAttribute("y2", yy2);
    group.appendChild(el);
  }

  // 主軸
  line(x, y, x2, y2);

  let remaining = knots;
  let position = shaftLength - 1;
  const step = 5.2;

  // 50ノット単位の旗
  while (remaining >= 50) {
    const bx = x + dx * position;
    const by = y + dy * position;

    const ex = bx - dx * 8;
    const ey = by - dy * 8;

    const flag = document.createElementNS(ns, "polygon");
    flag.setAttribute(
      "points",
      `${bx},${by} ${ex},${ey} ${ex + dy * 10},${ey - dx * 10}`
    );

    group.appendChild(flag);
    remaining -= 50;
    position -= step;
  }

  // 10ノット単位の長い羽根
  while (remaining >= 10) {
    const bx = x + dx * position;
    const by = y + dy * position;

    line(
      bx, by,
      bx + dy * 10,
      by + dx * 10
    );

    remaining -= 10;
    position -= step;
  }

  // 5ノット単位の短い羽根
  if (remaining >= 5) {
    const bx = x + dx * position;
    const by = y + dy * position;

    line(
      bx, by,
      bx + dy * 5,
      by + dx * 5
    );
  }

  svg.appendChild(group);
}

/* 矢羽根をPlotly図の上に重ねる。 */
function drawWindOverlay(gd, times, windByLevel) {
  const svg = document.getElementById("windOverlay");
  svg.replaceChildren();

  const width = gd.clientWidth;
  const height = gd.clientHeight;

  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);

  const full = gd._fullLayout;
  if (!full || !full.xaxis || !full.yaxis) return;

  const xa = full.xaxis;
  const ya = full.yaxis;

  const xOffset = xa._offset;
  const yOffset = ya._offset;

  // 矢羽根は元データの気圧面に配置し、3時間ごとに表示
  for (const level of PRESSURE_LEVELS) {
    const series = windByLevel[level];
    if (!series) continue;

    for (let i = 0; i < times.length; i += 3) {
      const u = series.u[i];
      const v = series.v[i];

      if (!Number.isFinite(u) || !Number.isFinite(v)) {
        continue;
      }

      const wind = vectorToWind(u, v);
      const xPx = xOffset + xa.d2p(times[i]);
      const yPx = yOffset + ya.d2p(level);

      makeWindBarb(
        svg, xPx, yPx,
        wind.speedMs, wind.direction
      );
    }
  }
}

async function drawChart() {
  const errorEl = document.getElementById("error");
  errorEl.textContent = "";

  const lat = Number(document.getElementById("latitude").value);
  const lon = Number(document.getElementById("longitude").value);

  if (
    !Number.isFinite(lat) || lat < -90 || lat > 90 ||
    !Number.isFinite(lon) || lon < -180 || lon > 180
  ) {
    errorEl.textContent = "緯度または経度が範囲外です。";
    return;
  }

  const variables = [];

  for (const p of PRESSURE_LEVELS) {
    variables.push(
      `temperature_${p}hPa`,
      `dew_point_${p}hPa`,
      `wind_speed_${p}hPa`,
      `wind_direction_${p}hPa`
    );
  }

  const params = new URLSearchParams({
    latitude: String(lat),
    longitude: String(lon),
    hourly: variables.join(","),
    models: MODEL,
    forecast_days: String(FORECAST_DAYS),
    timezone: TIMEZONE,
    wind_speed_unit: "ms"
  });

  const url =
    "https://api.open-meteo.com/v1/forecast?" +
    params.toString();

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(`APIエラー: HTTP ${response.status}`);
    }

    const data = await response.json();

    if (
      !data.hourly ||
      !Array.isArray(data.hourly.time)
    ) {
      throw new Error("予報データの形式が想定と異なります。");
    }

    const times = data.hourly.time.map(timeToEpoch);
    const xDates = times.map(t => new Date(t));

    const temperature = [];
    const dewpoint = [];
    const spread = [];
    const windByLevel = {};

    for (const p of PRESSURE_LEVELS) {
      // 気温・露点温度は時間方向の欠損を補間
      const t = interpolateMissing(
        numericArray(data.hourly[`temperature_${p}hPa`])
      );

      const td = interpolateMissing(
        numericArray(data.hourly[`dew_point_${p}hPa`])
      );

      temperature.push(t);
      dewpoint.push(td);

      // T−Tdを算出
      spread.push(
        t.map((value, i) =>
          Number.isFinite(value) &&
          Number.isFinite(td[i])
            ? value - td[i]
            : NaN
        )
      );

      // 風の成分も時間方向の欠損を補間
      windByLevel[p] = windComponents(
        numericArray(data.hourly[`wind_speed_${p}hPa`]),
        numericArray(data.hourly[`wind_direction_${p}hPa`])
      );
    }

    /*
     * 時間方向の欠損補間に加えて、気圧方向にも補間し、
     * 描画用の密な格子に変換する。
     */
    const smoothTemperature = interpolatePressureGrid(
      temperature, PRESSURE_LEVELS, DENSE_PRESSURES
    );

    const smoothSpread = interpolatePressureGrid(
      spread, PRESSURE_LEVELS, DENSE_PRESSURES
    );

    /*
     * T−Tdの色分け：
     * 3℃以下：濃い緑
     * 3℃超〜6℃以下：薄い緑
     * 6℃超〜15℃未満：透明
     * 15℃以上：黄色
     *
     * T−Tdの等値線は描画しない。
     */
    const spreadTrace = {
      type: "heatmap",
      x: xDates,
      y: DENSE_PRESSURES,
      z: smoothSpread,
      zmin: 0,
      zmax: 30,
      zsmooth: "best",
      showscale: false,
      hovertemplate:
        "時刻: %{x|%m/%d %H:%M}<br>" +
        "気圧: %{y} hPa<br>" +
        "T−Td: %{z:.1f}℃<extra></extra>",
      colorscale: [
        [0.0000, "#18752b"],
        [0.0999, "#18752b"],
        [0.1000, "#b9e6a5"],
        [0.1999, "#b9e6a5"],
        [0.2000, "rgba(255,255,255,0)"],
        [0.4999, "rgba(255,255,255,0)"],
        [0.5000, "#ffe84a"],
        [1.0000, "#ffe84a"]
      ]
    };

    /*
     * 気温等値線は3℃間隔。
     * T−Tdの等値線は作らない。
     */
    const temperatureTrace = {
      type: "contour",
      x: xDates,
      y: DENSE_PRESSURES,
      z: smoothTemperature,
      autocontour: false,
      contours: {
        start: -60,
        end: 45,
        size: TEMPERATURE_INTERVAL,
        coloring: "lines",
        showlabels: true,
        labelfont: {
          size: 10,
          color: "#222"
        }
      },
      line: {
        color: "#333",
        width: 1
      },
      showscale: false,
      connectgaps: true,
      hovertemplate:
        "時刻: %{x|%m/%d %H:%M}<br>" +
        "気圧: %{y} hPa<br>" +
        "気温: %{z:.1f}℃<extra></extra>"
    };

    const layout = {
      title: {
        text:
          `気圧面・時間断面図　` +
          `緯度 ${lat.toFixed(2)}°　経度 ${lon.toFixed(2)}°`,
        x: 0.5
      },
      autosize: true,
      margin: { l: 75, r: 25, t: 70, b: 80 },
      paper_bgcolor: "white",
      plot_bgcolor: "white",

      xaxis: {
        title: "日本標準時",
        type: "date",
        tickformat: "%m/%d<br>%H:%M",
        showgrid: true,
        gridcolor: "#ddd",
        zeroline: false,
        fixedrange: true
      },

      yaxis: {
        title: "気圧 (hPa)",
        type: "linear",
        range: [950, 275],
        tickmode: "array",
        tickvals: PRESSURE_LEVELS,
        ticktext: PRESSURE_LEVELS.map(String),
        showgrid: true,
        gridcolor: "#ccc",
        zeroline: false,
        fixedrange: true
      },

      showlegend: false,
      dragmode: false
    };

    const config = {
      responsive: true,
      displaylogo: false,
      scrollZoom: false,
      doubleClick: false,
      staticPlot: false,
      modeBarButtonsToRemove: [
        "zoom2d",
        "pan2d",
        "select2d",
        "lasso2d",
        "zoomIn2d",
        "zoomOut2d",
        "autoScale2d",
        "resetScale2d"
      ]
    };

    const gd = document.getElementById("chart");

    await Plotly.newPlot(
      gd,
      [spreadTrace, temperatureTrace],
      layout,
      config
    );

    gd._windTimes = times;
    gd._windData = windByLevel;

    drawWindOverlay(gd, times, windByLevel);

    if (!gd._windOverlayHandlerAttached) {
      gd.on("plotly_afterplot", () => {
        if (gd._windTimes && gd._windData) {
          drawWindOverlay(
            gd,
            gd._windTimes,
            gd._windData
          );
        }
      });

      gd._windOverlayHandlerAttached = true;
    }

  } catch (error) {
    errorEl.textContent =
      "図を作成できませんでした。\n" +
      (error && error.message
        ? error.message
        : String(error));
  }
}

document
  .getElementById("drawButton")
  .addEventListener("click", drawChart);

window.addEventListener("resize", () => {
  const gd = document.getElementById("chart");

  if (gd._windTimes && gd._windData) {
    drawWindOverlay(
      gd,
      gd._windTimes,
      gd._windData
    );
  }
});

/* 初回描画 */
drawChart();
</script>
</body>
</html>
