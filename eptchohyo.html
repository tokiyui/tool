<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>各国モデル安定度比較(@東京、400/500/700hPa：飽和相当温位、850/925hPa：温位)</title>
<style>
table { border-collapse: collapse; width: 100%; margin-bottom: 40px; }
th, td { border: 1px solid #999; padding: 5px; text-align: center; }
th { background-color: #eee; }
.green { background-color: #9f9; }
td { width: 4%; }
</style>
</head>
<body>

<h1>気象モデル比較表</h1>
<div id="tables"></div>

<script>
const models = [
  "ecmwf_ifs025",
  "gfs_global",
  "icon_global",
  "gem_global",
  "meteofrance_arpege_world",
  "ukmo_global_deterministic_10km",
  "jma_gsm"
];

const hPaLevels = ["400", "500", "700", "850", "925"];
const latitude = 35.75;
const longitude = 139.75;

// 表示時刻：03, 06, ... 21, 00
const hours = Array.from({length: 24}, (_, i) =>
  ((3 + i * 3) % 24).toString().padStart(2, "0")
);

// 飽和水蒸気圧 [hPa]
function saturationVaporPressure(T) {
  return 6.112 * Math.exp(17.67 * (T - 273.15) / (T - 29.65));
}

// 相当温位 θe [K]（Bolton式）
function equivalentPotentialTemperature(T, P, RH) {
  const Rd_Cpd = 0.2854;
  const epsilon = 0.622;
  const es = saturationVaporPressure(T);
  const e = es * RH / 100;
  const x = epsilon * e / (P - e);

  if (!Number.isFinite(x) || P - e <= 0 || e <= 0) return NaN;

  const lnRatio = Math.log(e / 6.112);
  const Td = 243.5 * lnRatio / (17.67 - lnRatio) + 273.15;
  const TLCL = 1 / (1 / (Td - 56) - Math.log(T / Td) / 800) + 56;

  return T *
    Math.pow(1000 / (P - e), Rd_Cpd) *
    Math.exp((3036 / TLCL - 1.78) * x * (1 + 0.448 * x));
}

// 飽和相当温位 θe* [K]
function saturationEquivalentPotentialTemperature(T, P) {
  const Rd_Cpd = 0.2854;
  const epsilon = 0.622;
  const es = saturationVaporPressure(T);
  const x = epsilon * es / (P - es);

  if (!Number.isFinite(x) || P - es <= 0) return NaN;

  return T *
    Math.pow(1000 / (P - es), Rd_Cpd) *
    Math.exp((3036 / T - 1.78) * x * (1 + 0.448 * x));
}

// 3時間降水量
function sumPrecipitation(hourIndex, precipitation) {
  return precipitation
    .slice(hourIndex - 2, hourIndex + 1)
    .reduce((a, b) => a + (b ?? 0), 0);
}

async function createTables() {
  const container = document.getElementById("tables");

  for (const model of models) {
    const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${latitude}` +
      `&longitude=${longitude}` +
      `&cell_selection=nearest` +
      `&hourly=precipitation,` +
      `relative_humidity_925hPa,relative_humidity_850hPa,` +
      `relative_humidity_700hPa,relative_humidity_500hPa,` +
      `relative_humidity_400hPa,` +
      `temperature_925hPa,temperature_850hPa,` +
      `temperature_700hPa,temperature_500hPa,temperature_400hPa` +
      `&models=${model}` +
      `&timezone=Asia%2FTokyo` +
      `&forecast_days=4`;

    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok || data.error) {
      console.error(model, data.reason || res.statusText);
      continue;
    }

    const hourly = data.hourly;

    const title = document.createElement("h2");
    title.textContent = model;
    container.appendChild(title);

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const trh = document.createElement("tr");

    const th0 = document.createElement("th");
    th0.textContent = "時刻";
    trh.appendChild(th0);

    hours.forEach(h => {
      const th = document.createElement("th");
      th.textContent = h;
      trh.appendChild(th);
    });

    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    // 400/500/700hPa：飽和相当温位、850/925hPa：相当温位
    for (const level of hPaLevels) {
      const tr = document.createElement("tr");

      const tdLevel = document.createElement("td");
      tdLevel.textContent = `${level}hPa`;
      tr.appendChild(tdLevel);

      hours.forEach((h, i) => {
        const hourIndex = 3 + i * 3;
        const T_C = hourly[`temperature_${level}hPa`][hourIndex];
        const RH = hourly[`relative_humidity_${level}hPa`][hourIndex];
        const td = document.createElement("td");

        if (!Number.isFinite(T_C) || !Number.isFinite(RH)) {
          td.textContent = "NaN";
          tr.appendChild(td);
          return;
        }

        const T = T_C + 273.15;
        const P = Number(level);

        const thetaES =
          saturationEquivalentPotentialTemperature(T, P);

        const thetaE =
          equivalentPotentialTemperature(T, P, RH);

        // 400/500/700hPaはθe*、850/925hPaはθeを表示
        const value =
          ["400", "500", "700"].includes(level)
            ? thetaES
            : thetaE;

        td.textContent =
          Number.isFinite(value) ? Math.round(value) : "NaN";

        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    }

    // 3時間降水量
    const trP = document.createElement("tr");
    const tdP = document.createElement("td");
    tdP.textContent = "3時間降水量";
    trP.appendChild(tdP);

    hours.forEach((h, i) => {
      const hourIndex = 3 + i * 3;
      const sum = sumPrecipitation(hourIndex, hourly.precipitation);
      const td = document.createElement("td");
      td.textContent = sum.toFixed(1);
      trP.appendChild(td);
    });

    tbody.appendChild(trP);
    table.appendChild(tbody);

    // θe* − θe <= 3K のセルを緑色にする
    for (let timeIndex = 0; timeIndex < hours.length; timeIndex++) {
      const hourIndex = 3 + timeIndex * 3;

      for (let levelIndex = 0; levelIndex < hPaLevels.length; levelIndex++) {
        const level = hPaLevels[levelIndex];
        const T_C = hourly[`temperature_${level}hPa`][hourIndex];
        const RH = hourly[`relative_humidity_${level}hPa`][hourIndex];

        if (!Number.isFinite(T_C) || !Number.isFinite(RH)) continue;

        const T = T_C + 273.15;
        const P = Number(level);

        const thetaES =
          saturationEquivalentPotentialTemperature(T, P);

        const thetaE =
          equivalentPotentialTemperature(T, P, RH);

        const difference = thetaES - thetaE;

        if (Number.isFinite(difference) && difference <= 3.0) {
          tbody.rows[levelIndex]
            .cells[timeIndex + 1]
            .classList.add("green");
        }
      }
    }

    container.appendChild(table);
  }
}

createTables();
</script>

</body>
</html>
