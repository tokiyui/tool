name: Python application

on:
  schedule:
    - cron: '40 4,10,16,19,22 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write # Gitへのコミット・プッシュに必要な権限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # 追加するマイマップのバックアップステップ
      - name: Download and Backup MyMap
        env:
          MAP_URL: ${{ secrets.MAP_URL }}
        run: |
          # URLが空でないかチェックする安全策
          if [ -z "$MAP_URL" ]; then
            echo "Error: MAP_URL secret is not set."
            exit 1
          fi
          
          curl -L "$MAP_URL" -o mymap.kml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mymap.kml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update mymap backup: $(date +'%Y-%m-%d')" && git push)

      - name: Settings
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python -m pip install --upgrade pip
          pip install bs4
          pip install google-auth google-auth-oauthlib google-api-python-client
          export PATH=$PATH:/opt/hostedtoolcache/Python/3.10.13/x64/lib/python3.10/site-packages:/home/runner/.local/lib/python3.10/site-packages

      - name: Action
        env:
          TokisenCalendar: ${{ secrets.TokisenCalendar }}
        run: |
          python TVandRadio.py
